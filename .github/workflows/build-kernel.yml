name: Build ARM64 kernel

on:
  workflow_dispatch:
  push:
    paths:
      - "Code_Opensource/kernel/**"
      - ".github/workflows/build-kernel.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison build-essential flex gcc-aarch64-linux-gnu \
            libssl-dev libelf-dev libncurses-dev device-tree-compiler cpio rsync

      - name: Prepare kernel configuration
        working-directory: Code_Opensource/kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          HOSTCC: gcc
          HOSTCXX: g++
          CC: aarch64-linux-gnu-gcc
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-actions
        run: |
          set -o pipefail
          rm -rf ../out
          mkdir -p ../out
          cp arch/arm64/configs/merge_denver_defconfig ../out/.config
          make O=../out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" CC="$CC" \
            HOSTCFLAGS="-fcommon -Wno-error" HOSTLDFLAGS="-fcommon" \
            olddefconfig 2>&1 | tee ../out/defconfig.log

      - name: Build kernel
        working-directory: Code_Opensource/kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          HOSTCC: gcc
          HOSTCXX: g++
          CC: aarch64-linux-gnu-gcc
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-actions
        run: |
          set -o pipefail
          make O=../out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" CC="$CC" \
            V=1 -j"$(nproc)" 2>&1 | tee ../out/build.log
          make O=../out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" CC="$CC" \
            modules_install INSTALL_MOD_PATH=../out/modules 2>&1 | tee ../out/modules.log

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p artifact
          printf 'commit=%s\n' '${{ github.sha }}' > artifact/ci-context.txt
          printf 'runner=%s\n' '${{ runner.os }}' >> artifact/ci-context.txt
          cp -a Code_Opensource/out/defconfig.log artifact/ 2>/dev/null || true
          cp -a Code_Opensource/out/build.log artifact/ 2>/dev/null || true
          cp -a Code_Opensource/out/modules.log artifact/ 2>/dev/null || true
          cp -a Code_Opensource/out/.config artifact/ 2>/dev/null || true
          cp -a Code_Opensource/out/arch/arm64/boot/Image artifact/ 2>/dev/null || true
          cp -a Code_Opensource/out/arch/arm64/boot/Image.gz artifact/ 2>/dev/null || true
          cp -a Code_Opensource/out/arch/arm64/boot/Image.gz-dtb artifact/ 2>/dev/null || true
          if [ -d Code_Opensource/out/modules ]; then
            cp -a Code_Opensource/out/modules artifact/
          fi
      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tel-an10-kernel-${{ github.sha }}
          path: artifact/**
          include-hidden-files: true
          if-no-files-found: warn
