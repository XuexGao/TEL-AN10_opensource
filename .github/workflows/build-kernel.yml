name: Build ARM64 kernel

on:
  workflow_dispatch:
  push:
    paths:
      - "Code_Opensource/kernel/**"
      - ".github/workflows/build-kernel.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: s

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison build-essential flex gcc-aarch64-linux-gnu \
            libssl-dev libelf-dev libncurses-dev device-tree-compiler cpio rsync

      # On ubuntu-22.04, the long build path combined with 50+ -I flags
      # in the HiSilicon modem driver overflows ARG_MAX (~2 MB including
      # the runner environment).  A symlink won't help because GNU Make
      # resolves $(CURDIR) via getcwd() to the real path, so we use a
      # bind mount to create a genuinely short path.
      - name: Create short build path
        run: |
          mkdir -p /tmp/kernel
          sudo mount --bind "$PWD/s/Code_Opensource/kernel" /tmp/kernel

      # Strip the huge CI environment so the compiler command line +
      # inherited environment stays well under ARG_MAX.
      - name: Prepare kernel configuration
        working-directory: /tmp/kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          HOSTCC: gcc
          HOSTCXX: g++
          CC: aarch64-linux-gnu-gcc
          KCFLAGS: -Wno-error=strict-prototypes -std=gnu99
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-actions
          HOME: /home/runner
          PATH: /usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin
        run: |
          set -o pipefail
          rm -rf /tmp/out
          mkdir -p /tmp/out
          cp arch/arm64/configs/merge_denver_defconfig /tmp/out/.config
          # Disable drivers that fail with GCC 11's always_inline errors.
          # These are genuine kernel code bugs that need upstream fixes.
          scripts/config --file /tmp/out/.config \
            -d CONFIG_I3C \
            -d CONFIG_DW_I3C_MASTER \
            -d CONFIG_HISI_I3C_DESIGNWARE \
            -d CONFIG_DEVFREQ_GOV_NPU_PM_QOS \
            -d CONFIG_NPU_DEVDRV \
            -d CONFIG_NPU_DEVDRV_DEVMANAGER \
            -d CONFIG_NPU_DEVDRV_DEVDRIVER \
            -d CONFIG_NPU_DEVDRV_DEVPLATFORM \
            -d CONFIG_NPU_DEVDRV_DEVFACILITY \
            -d CONFIG_NPU_LOG_DEVDRV \
            -d CONFIG_NPU_PROF_DEVDRV \
            -d CONFIG_NPU_PM \
            -d CONFIG_NPUFREQ \
            -d CONFIG_NPU_PM_AVS_VDM \
            -d CONFIG_NPU_PM_AVS_NEW_TZONE \
            -d CONFIG_NPUFREQ_PM_QOS \
            -d CONFIG_THERMAL_NPU_HOTPLUG \
            -d CONFIG_THERMAL_NPU
          env -i HOME="$HOME" PATH="$PATH" USER="$USER" \
            ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" CC="$CC" \
            KCFLAGS="$KCFLAGS" \
            KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
            KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
            make O=/tmp/out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" CC="$CC" \
            KCFLAGS="$KCFLAGS" \
            HOSTCFLAGS="-fcommon -Wno-error" HOSTLDFLAGS="-fcommon" \
            olddefconfig 2>&1 | tee /tmp/out/defconfig.log

      - name: Build kernel
        working-directory: /tmp/kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          HOSTCC: gcc
          HOSTCXX: g++
          CC: aarch64-linux-gnu-gcc
          KCFLAGS: -Wno-error=strict-prototypes -std=gnu99
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-actions
          HOME: /home/runner
          PATH: /usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin
        run: |
          set -o pipefail
          env -i HOME="$HOME" PATH="$PATH" USER="$USER" \
            ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" CC="$CC" \
            KCFLAGS="$KCFLAGS" \
            KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
            KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
            make O=/tmp/out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" CC="$CC" \
            KCFLAGS="$KCFLAGS" \
            HOSTCFLAGS="-fcommon -Wno-error" HOSTLDFLAGS="-fcommon" \
            V=1 -j"$(nproc)" 2>&1 | tee /tmp/out/build.log
          env -i HOME="$HOME" PATH="$PATH" USER="$USER" \
            ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" CC="$CC" \
            KCFLAGS="$KCFLAGS" \
            KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
            KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
            make O=/tmp/out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" CC="$CC" \
            KCFLAGS="$KCFLAGS" \
            HOSTCFLAGS="-fcommon -Wno-error" HOSTLDFLAGS="-fcommon" \
            modules_install INSTALL_MOD_PATH=/tmp/out/modules 2>&1 | tee /tmp/out/modules.log

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p artifact
          printf 'commit=%s\n' '${{ github.sha }}' > artifact/ci-context.txt
          printf 'runner=%s\n' '${{ runner.os }}' >> artifact/ci-context.txt
          cp -a /tmp/out/defconfig.log artifact/ 2>/dev/null || true
          cp -a /tmp/out/build.log artifact/ 2>/dev/null || true
          cp -a /tmp/out/modules.log artifact/ 2>/dev/null || true
          cp -a /tmp/out/.config artifact/ 2>/dev/null || true
          cp -a /tmp/out/arch/arm64/boot/Image artifact/ 2>/dev/null || true
          cp -a /tmp/out/arch/arm64/boot/Image.gz artifact/ 2>/dev/null || true
          cp -a /tmp/out/arch/arm64/boot/Image.gz-dtb artifact/ 2>/dev/null || true
          if [ -d /tmp/out/modules ]; then
            cp -a /tmp/out/modules artifact/
          fi
      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tel-an10-kernel-${{ github.sha }}
          path: artifact/**
          include-hidden-files: true
          if-no-files-found: warn
